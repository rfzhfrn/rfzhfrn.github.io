<head>

  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Page ── */
    body {
      font-family: 'Mulish', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background-color: #3d0b0b;
      padding: 24px 16px 48px;
    }

    /* ── Outer wrapper ── */
    .page-wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── Top icon buttons ── */
    .top-buttons {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s;
    }

    .top-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .top-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* ── Centre card ── */
    .card {
      width: 100%;
      background-color: #b41818;
      border-radius: 24px;
      padding: 40px 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Avatar ── */
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.6);
      overflow: hidden;
      margin-bottom: 16px;
      background: #8b1010;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Username ── */
    .username {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    /* ── Bio ── */
    .bio {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      line-height: 1.5;
      max-width: 300px;
      margin-bottom: 20px;
    }

    /* ── Social icons row ── */
    .socials {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: opacity 0.18s, transform 0.15s;
    }

    .social-icon:hover {
      opacity: 0.75;
      transform: scale(1.12);
    }

    .social-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    /* ── Link buttons ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 56px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      text-decoration: none;
      color: #ffffff;
      font-family: 'Mulish', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.13s;
      position: relative;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.45);
      transform: scale(1.01);
    }

    .link-btn:active {
      transform: scale(0.99);
    }

    /* Icon box on left */
    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    /* Label centred in button */
    .btn-label {
      flex: 1;
      text-align: center;
    }

    /* With icon: shift label left to compensate for icon width */
    .link-btn.has-icon .btn-label {
      margin-left: -34px;
    }

    /* Three-dot menu on right */
    .btn-dots {
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
      letter-spacing: 1px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── CTA button ── */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 9999px;
      background: #ffffff;
      color: #1a0505;
      font-family: 'Mulish', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.18s, transform 0.13s;
    }

    .cta-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* ── Footer ── */
    .footer {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .footer a {
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
    }

    .footer a:hover {
      color: rgba(255, 255, 255, 0.7);
    }

    .footer span {
      opacity: 0.5;
    }
  </style>
